<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>My Apps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #15151f 0%, #08080d 70%);
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .header { text-align: center; margin-bottom: 48px; }
    .header h1 {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ff6b00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: #888; font-size: 16px; margin-top: 8px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 640px;
    }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .app-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #16161f 0%, #0f0f16 100%);
      border: 1px solid #26263a;
      border-radius: 20px;
      padding: 36px 24px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }
    .app-card.gym:hover { border-color: rgba(255,107,0,0.5); box-shadow: 0 12px 40px rgba(255,107,0,0.2); }
    .app-card.brain:hover { border-color: rgba(255,215,0,0.5); box-shadow: 0 12px 40px rgba(255,215,0,0.2); }
    .app-icon { font-size: 64px; margin-bottom: 16px; }
    .app-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .app-card p { font-size: 14px; color: #999; line-height: 1.5; }
    .app-card .launch {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 24px;
    }
    .gym .launch { background: rgba(255,107,0,0.15); color: #ff8c33; }
    .brain .launch { background: rgba(255,215,0,0.12); color: #ffd700; }
    .footer { margin-top: 48px; color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>My Apps</h1>
    <p>Pick an app to launch</p>
  </div>

  <div class="grid">
    <a class="app-card gym" href="./gym-tracker/index.html">
      <div class="app-icon">🏋️</div>
      <h2>GymTrack Pro</h2>
      <p>Track workouts, progress photos, and body measurements</p>
      <span class="launch">Launch →</span>
    </a>

    <a class="app-card brain" href="./brain-trust/index.html">
      <div class="app-icon">🧠</div>
      <h2>Brain Trust</h2>
      <p>15 AI business experts roast and audit your business</p>
      <span class="launch">Launch →</span>
    </a>
  </div>

  <div class="footer">Built with Claude Code</div>
</body>
</html>
