name: Update Brain Trust holdings

on:
  schedule:
    - cron: '0 8 * * 1'  # every Monday 08:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest SEC filings
        run: python scripts/fetch-holdings.py

      - name: Fetch smart-money data for Marrow
        run: python scripts/fetch-smart-money.py

      - name: Commit + push if changed
        run: |
          git config user.name "holdings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brain-trust/holdings.json marrow/smartmoney.json
          if git diff --staged --quiet; then
            echo "No change to holdings or smart-money data"
            exit 0
          fi
          git commit -m "Auto: refresh holdings + smart-money data from public filings"
          git push
