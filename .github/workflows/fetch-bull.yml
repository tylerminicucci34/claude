name: Fetch bull asset (one-off)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the generated bull render
        run: |
          mkdir -p marrow/assets
          curl -fsSL -o marrow/assets/bull.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3EpwhBxSaAyeuCPmcNBGZg84RPq/hf_20260718_161949_2010ba7c-f0ff-4fb3-804c-6b33b3c678a8.png"
          ls -la marrow/assets/
      - name: Commit + push
        run: |
          git config user.name "asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add marrow/assets/bull.png
          git commit -m "Add 3D bull render asset"
          git push
