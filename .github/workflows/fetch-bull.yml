name: Fetch bull asset (one-off)

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the front-facing bull render
        run: |
          curl -fsSL -o marrow/assets/bull.png \
            "https://d8j0ntlcm91z4.cloudfront.net/user_3EpwhBxSaAyeuCPmcNBGZg84RPq/hf_20260718_162436_17114129-64f3-46db-94bb-8c06b81322ac.png"
          ls -la marrow/assets/
      - name: Commit + push
        run: |
          git config user.name "asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add marrow/assets/bull.png
          git commit -m "Swap bull render for front-facing view"
          git push
