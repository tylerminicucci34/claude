<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Business Brain Trust v10</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">🧠</div>
      <div>
        <div class="brand-name">Brain Trust</div>
        <div class="brand-sub">v10 · 15 Experts</div>
      </div>
    </div>

    <div class="side-section">
      <div class="side-label">Select Expert</div>
      <div id="expertList" class="expert-list"></div>
    </div>

    <div class="side-section">
      <div class="side-label">Session</div>
      <button id="exportBtn" class="side-btn">📥 Export Session</button>
      <button id="clearBtn" class="side-btn">🗑️ Clear Chat</button>
      <button id="glossaryBtn" class="side-btn">📖 Glossary</button>
    </div>

    <div class="side-section">
      <div class="side-label">Tags</div>
      <div id="tagList" class="tag-list"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">

    <!-- MODE TABS -->
    <nav id="modeTabs" class="mode-tabs"></nav>

    <!-- MODE HEADER -->
    <header id="modeHeader" class="mode-header">
      <div class="mode-header-icon">📊</div>
      <div class="mode-header-text">
        <div class="mode-header-name">Hot Seat</div>
        <div class="mode-header-desc">Describe your business or situation in detail. All 15 experts roast and audit it simultaneously, each finding the biggest problem from their lens with a severity rating.</div>
      </div>
      <button id="glossaryBtnMobile" class="glossary-btn" title="Open glossary">📖 Glossary</button>
      <button id="clearChatBtn" class="clear-chat-btn" title="Clear all chat history">🗑️ Clear</button>
    </header>

    <!-- GLOSSARY DRAWER -->
    <div id="glossaryDrawer" class="glossary-drawer">
      <div class="glossary-card">
        <div class="glossary-head">
          <div class="glossary-title">📖 Glossary</div>
          <button id="closeGlossary" class="glossary-close">✕</button>
        </div>
        <input id="glossarySearch" class="glossary-search" type="text" placeholder="Search a term…" />
        <div id="glossaryList" class="glossary-list"></div>
      </div>
    </div>

    <!-- CHAT -->
    <section id="chat" class="chat"></section>

    <!-- HINT CHIPS -->
    <div id="hintChips" class="hint-chips"></div>

    <!-- INPUT -->
    <footer class="composer">
      <div class="composer-meta">
        <span id="composerExpert" class="composer-expert">All Experts</span>
        <button id="tagBtn" class="composer-tag" title="Tag this conversation">🏷️ Untagged</button>
      </div>
      <div class="composer-row">
        <textarea id="userInput" placeholder="Describe your situation..." rows="2"></textarea>
        <button id="sendBtn" class="send-btn">Send ↗</button>
      </div>
    </footer>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
