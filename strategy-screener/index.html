<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e14">
<title>Strategy Screener</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0e14; --panel:#0f1621; --panel2:#0c121b; --line:#1c2634;
    --txt:#e6edf3; --mut:#7d8896; --green:#22c55e; --red:#ef4444; --amber:#eab308;
    --cyan:#22d3ee; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100dvh;padding-bottom:60px}
  .banner{position:sticky;top:0;z-index:50;background:repeating-linear-gradient(45deg,#2a0f0f,#2a0f0f 12px,#320f0f 12px,#320f0f 24px);
    color:#ffb4b4;font-size:12.5px;font-weight:700;text-align:center;padding:8px 14px;border-bottom:1px solid #4a1d1d;letter-spacing:.3px}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 0}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .top a{color:var(--mut);text-decoration:none;font-size:13px;font-weight:600}
  .top a:hover{color:var(--cyan)}
  h1{font-size:30px;font-weight:900;letter-spacing:-.5px;
    background:linear-gradient(120deg,#22d3ee,#22c55e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--mut);font-size:14px;margin:4px 0 20px}
  .panel{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
  .panel h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld span{font-size:11px;color:var(--mut);font-weight:600}
  .fld input{font-family:var(--mono);font-size:14px;color:var(--txt);background:#070b11;
    border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  .fld input:focus{outline:none;border-color:var(--cyan)}
  .fld.tick input{text-transform:uppercase;font-weight:800;letter-spacing:1px;color:var(--cyan)}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt);align-self:end;padding:9px 0}
  .chk input{width:16px;height:16px;accent-color:var(--green)}
  .actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  button{font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;border-radius:10px;padding:11px 24px;border:1px solid transparent;transition:filter .15s}
  .btn-go{background:linear-gradient(120deg,#0891b2,#15803d);color:#fff}
  .btn-go:hover{filter:brightness(1.12)}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--mut)}
  .hint{color:var(--amber);font-size:12.5px;margin-top:10px}
  /* gauges */
  .gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:640px){.gauges{grid-template-columns:repeat(2,1fr)}}
  .gauge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;position:relative}
  .gauge.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
  .gauge svg{display:block;margin:0 auto}
  .gauge-num{font-family:var(--mono);font-size:22px;font-weight:800}
  .gauge-label{font-size:11.5px;font-weight:700;margin-top:6px}
  .gauge-note{font-size:10.5px;color:var(--mut);margin-top:5px;line-height:1.35;min-height:28px}
  .badge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;text-transform:uppercase}
  .b-red{background:rgba(239,68,68,.16);color:#fca5a5}
  /* verdict */
  .verdict{border-radius:14px;padding:22px;text-align:center;border:1px solid}
  .verdict.go{background:radial-gradient(ellipse at top,rgba(34,197,94,.14),transparent 70%);border-color:rgba(34,197,94,.5)}
  .verdict.stop{background:radial-gradient(ellipse at top,rgba(239,68,68,.14),transparent 70%);border-color:rgba(239,68,68,.5)}
  .v-big{font-size:40px;font-weight:900;letter-spacing:1px}
  .go .v-big{color:var(--green)} .stop .v-big{color:var(--red)}
  .v-strat{font-size:14px;font-weight:700;color:var(--txt);margin-top:6px}
  .v-reason{font-size:13.5px;color:var(--mut);margin-top:8px;max-width:640px;margin-left:auto;margin-right:auto;line-height:1.5}
  .bear{margin-top:14px;font-size:12.5px;color:#fca5a5;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:10px 14px}
  .bear b{color:#ffb4b4}
  /* risk plan */
  .risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.risk-grid{grid-template-columns:repeat(2,1fr)}}
  .rk{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .rk .v{font-family:var(--mono);font-size:19px;font-weight:800}
  .rk .l{font-size:11px;color:var(--mut);margin-top:3px}
  .rk.entry .v{color:var(--cyan)} .rk.stop2 .v{color:var(--red)} .rk.target .v{color:var(--green)}
  .rk-note{font-size:11.5px;color:var(--mut);margin-top:12px;text-align:center}
  .rk-note b{color:var(--green)}
  /* journal */
  .scrollx{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
  .jt{font-weight:800;color:var(--cyan);font-family:var(--mono)}
  .v-go{color:var(--green);font-weight:800} .v-stop{color:var(--red);font-weight:800}
  .obtn{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:4px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
  .obtn.win.on{background:rgba(34,197,94,.18);color:var(--green);border-color:transparent}
  .obtn.loss.on{background:rgba(239,68,68,.18);color:var(--red);border-color:transparent}
  .hitrate{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}
  .hr{font-family:var(--mono)}
  .hr .n{font-size:24px;font-weight:900} .hr .l{font-size:11px;color:var(--mut)}
  .empty{color:var(--mut);font-size:13px}
  .footer{text-align:center;color:#4a5563;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<div class="banner">⚠ Educational tool. Not financial advice. Most day traders lose money.</div>
<div id="root"></div>

<!-- Pure scoring + rules engine (plain JS, unit-testable) -->
<script>
"use strict";
var clamp = function(v,lo,hi){ return Math.min(hi,Math.max(lo,v)); };
var num = function(v){ if(v===''||v==null) return null; var n=parseFloat(v); return isFinite(n)?n:null; };

// scoreMomentum: 12-month lookback momentum (academically strongest).
function scoreMomentum(d){
  if(d.price==null||d.ma200==null) return {key:'momentum',name:'Momentum',score:0,na:true,notes:['Need price & 200-day MA'],dir:'strength'};
  var s=0, notes=[];
  if(d.ret12m!=null) s+=clamp(d.ret12m/30*30,0,30);
  if(d.ret6m!=null)  s+=clamp(d.ret6m/20*22,0,22);
  if(d.ret3m!=null)  s+=clamp(d.ret3m/12*8,0,8);
  var above200 = d.price>d.ma200;
  if(above200) s+=20; else notes.push('price below 200-day MA');
  if(d.high52!=null) s+=clamp((d.price/d.high52-0.8)/0.2,0,1)*20;
  else notes.push('no 52-wk high entered');
  // noise penalty: momentum only on <1 month timeframe
  var shortOnly = (d.ret1m!=null && d.ret1m>3) && (d.ret6m==null||d.ret6m<=0) && (d.ret12m==null||d.ret12m<=0);
  if(shortOnly){ s=Math.min(s,20); notes.push('momentum only on <1mo timeframe — noise, not momentum'); }
  if(above200 && (d.ret12m||0)>15) notes.push('trending above 200-day MA with strong 12-mo return');
  return {key:'momentum',name:'Momentum',score:Math.round(clamp(s,0,100)),notes:notes,dir:'strength'};
}

// scoreTrend: MA-stack trend following; zero in choppy structure.
function scoreTrend(d){
  if([d.price,d.ma20,d.ma50,d.ma200].some(function(x){return x==null;}))
    return {key:'trend',name:'Trend Following',score:0,na:true,notes:['Need price & 20/50/200 MAs'],dir:'strength'};
  var stacked = d.ma20>d.ma50 && d.ma50>d.ma200;
  var spread = Math.abs(d.ma20-d.ma200)/d.ma200*100;
  if(spread<1.0) return {key:'trend',name:'Trend Following',score:0,noTrade:true,notes:['choppy/sideways structure — NO TRADE'],dir:'strength'};
  if(!stacked)   return {key:'trend',name:'Trend Following',score:0,noTrade:true,notes:['MAs not stacked bullishly (no clean uptrend)'],dir:'strength'};
  var s=40, notes=['20 > 50 > 200 stacked bullishly'];
  if(d.price>d.ma20) s+=25; else notes.push('price below 20-day MA');
  if(d.price>d.ma50 && d.price>d.ma200) s+=15;
  s+=clamp(spread/10*20,0,20);
  // "riding above the 20 EMA" is core: a pullback below the 20-MA is not an entry.
  if(!(d.price>d.ma20)){ s=Math.min(s,45); notes.push('price below 20-day MA — wait for a reclaim, not an entry'); }
  return {key:'trend',name:'Trend Following',score:Math.round(clamp(s,0,100)),notes:notes,dir:'strength'};
}

// scoreMeanReversion: only a valid long in an UPTREND. Downtrend = falling knife.
function scoreMeanReversion(d){
  if(d.price==null||d.rsi==null||d.ma200==null)
    return {key:'meanrev',name:'Mean Reversion',score:0,na:true,notes:['Need price, RSI & 200-day MA'],dir:'weakness'};
  var uptrend = d.price>d.ma200 && (d.ma50==null || d.ma50>=d.ma200);
  if(!uptrend) return {key:'meanrev',name:'Mean Reversion',score:0,fallingKnife:true,noTrade:true,notes:['downtrend — buying this dip is a FALLING KNIFE'],dir:'weakness'};
  var oversold = d.rsi<30, s=0, notes=[];
  if(oversold) s+=clamp((30-d.rsi)*3,0,45); else notes.push('RSI not < 30 — not an oversold setup');
  var atSupport = d.support!=null && Math.abs(d.price-d.support)/d.support<0.03;
  if(atSupport) s+=35; else if(d.support!=null) notes.push('price not at defined support'); else notes.push('no support level entered');
  if(d.ma50!=null && d.ma50>d.ma200) s+=20;
  if(!oversold) s=Math.min(s,20);
  if(oversold && atSupport) notes.push('oversold at support inside an uptrend');
  return {key:'meanrev',name:'Mean Reversion',score:Math.round(clamp(s,0,100)),notes:notes,dir:'weakness'};
}

// scoreBreakout: resistance break confirmed by 1.5x+ volume and a green tape.
function scoreBreakout(d){
  if(d.price==null||d.avgVol==null||d.todayVol==null)
    return {key:'breakout',name:'Volume Breakout',score:0,na:true,notes:['Need price & volumes'],dir:'strength'};
  var volRatio = d.avgVol>0 ? d.todayVol/d.avgVol : 0;
  if(d.resistance==null) return {key:'breakout',name:'Volume Breakout',score:0,noTrade:true,notes:['no resistance level entered'],dir:'strength',volRatio:volRatio};
  if(d.price<d.resistance) return {key:'breakout',name:'Volume Breakout',score:0,noTrade:true,notes:['price has not broken resistance'],dir:'strength',volRatio:volRatio};
  var s=40, notes=['broke resistance at '+d.resistance];
  s+=clamp((volRatio-1)*70,0,35);
  if(d.marketGreen) s+=25; else notes.push('broader market/sector not green');
  var falseBreak = volRatio<1.5;
  if(falseBreak) notes.push('low volume ('+volRatio.toFixed(1)+'x) — likely FALSE breakout');
  return {key:'breakout',name:'Volume Breakout',score:Math.round(clamp(s,0,100)),notes:notes,falseBreak:falseBreak,dir:'strength',volRatio:volRatio};
}

var BEAR = {
  momentum:'Momentum reverses at the highs — late longs pile in right before the trend exhausts and rolls over.',
  trend:'A close back below the 50-day MA breaks the stack and turns your trend trade into a failed breakout.',
  meanrev:'Support gives way and the "dip" becomes a downtrend — the falling knife you were trying to avoid.',
  breakout:'The breakout is a bull trap: price fades back under resistance as volume dries up and trapped buyers bail.'
};

// analyze: run all four, apply the hard-coded rules engine, return a verdict.
function analyze(d){
  var strategies = [scoreMomentum(d), scoreTrend(d), scoreMeanReversion(d), scoreBreakout(d)];
  var best = strategies.reduce(function(a,c){ return c.score>a.score?c:a; });
  var strengthMax = Math.max(strategies[0].score, strategies[1].score, strategies[3].score);
  var meanRev = strategies[2].score;
  var conflict = strengthMax>=55 && meanRev>=55; // buy-strength AND buy-weakness both firing
  var verdict='NO TRADE', reason='', tradeStrat=null;
  if(d.price==null){ verdict='NO TRADE'; reason='Enter at least a price and the moving averages to screen this ticker.'; }
  else if(best.score<60){ verdict='NO TRADE'; reason='No strategy shows a strong enough edge (best is '+best.name+' at '+best.score+'/100). Standing aside IS the trade.'; }
  else if(conflict){ verdict='NO TRADE'; reason='Signals conflict — a strength strategy and mean-reversion are both firing. Contradictory theses = no trade.'; }
  else if(best.noTrade || best.fallingKnife){ verdict='NO TRADE'; reason=(best.notes&&best.notes[0])||'Best-fit strategy flags no trade.'; }
  else { verdict='TRADE'; tradeStrat=best; reason='Clear, single-thesis edge from '+best.name+' ('+best.score+'/100).'; }
  return {strategies:strategies, best:best, verdict:verdict, reason:reason, tradeStrat:tradeStrat, conflict:conflict,
    bear: BEAR[best.key]};
}

// riskPlan: strategy-appropriate stop, 2:1 target, and 2%-max position sizing.
function riskPlan(d, strat, accountSize){
  var entry=d.price, stop;
  if(strat.key==='meanrev')      stop = d.support!=null ? d.support*0.98 : entry*0.95;
  else if(strat.key==='breakout')stop = d.resistance!=null ? d.resistance*0.98 : entry*0.95;
  else if(strat.key==='trend')   stop = d.ma20!=null ? Math.min(d.ma20*0.99, entry*0.97) : entry*0.93;
  else                           stop = d.ma50!=null ? Math.min(d.ma50, entry*0.90) : entry*0.90;
  if(stop>=entry) stop=entry*0.95;
  var riskPerShare = entry-stop;
  var target = entry + 2*riskPerShare;               // 2:1 minimum reward:risk
  var maxRiskDollars = accountSize!=null ? accountSize*0.02 : null;  // hard 2% cap
  var shares=null, positionValue=null, riskDollars=null, riskPct=null;
  if(accountSize!=null && riskPerShare>0){
    shares = Math.floor(maxRiskDollars/riskPerShare);
    if(shares*entry>accountSize) shares=Math.floor(accountSize/entry); // no margin
    if(shares<0) shares=0;
    positionValue = shares*entry;
    riskDollars = shares*riskPerShare;
    riskPct = accountSize>0 ? riskDollars/accountSize*100 : null;
  }
  return {entry:entry,stop:stop,riskPerShare:riskPerShare,target:target,maxRiskDollars:maxRiskDollars,
    shares:shares,positionValue:positionValue,riskDollars:riskDollars,riskPct:riskPct,rr:2};
}

if(typeof module!=='undefined') module.exports={scoreMomentum:scoreMomentum,scoreTrend:scoreTrend,scoreMeanReversion:scoreMeanReversion,scoreBreakout:scoreBreakout,analyze:analyze,riskPlan:riskPlan,clamp:clamp,num:num};
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState, useEffect} = React;

const FIELDS = [
  ['ticker','Ticker','tick'],['price','Current price'],['high52','52-wk high'],['low52','52-wk low'],
  ['ma20','20-day MA'],['ma50','50-day MA'],['ma200','200-day MA'],['rsi','14-day RSI'],
  ['avgVol','Avg volume'],['todayVol','Today volume'],['resistance','Resistance level'],['support','Support level'],
  ['ret1m','1-mo return %'],['ret3m','3-mo return %'],['ret6m','6-mo return %'],['ret12m','12-mo return %'],
];

const fmt = (n, opts={}) => {
  if(n==null || !isFinite(n)) return '—';
  const {money,pct,dec=2} = opts;
  if(money) return '$'+n.toLocaleString(undefined,{maximumFractionDigits:0});
  if(pct) return n.toFixed(1)+'%';
  return n.toFixed(dec);
};
const gaugeColor = s => s>=70?'#22c55e':s>=45?'#eab308':'#ef4444';

function Gauge({strat, active}){
  const r=32, c=2*Math.PI*r, off=c*(1-strat.score/100), col=gaugeColor(strat.score);
  const flag = strat.fallingKnife?'knife':strat.falseBreak?'false':strat.noTrade?'no trade':null;
  return (
    <div className={'gauge'+(active?' active':'')}>
      {flag && <span className="badge b-red">{flag}</span>}
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle cx="42" cy="42" r={r} stroke="#1c2634" strokeWidth="7" fill="none"/>
        <circle cx="42" cy="42" r={r} stroke={col} strokeWidth="7" fill="none" strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={off} transform="rotate(-90 42 42)"/>
        <text x="42" y="48" textAnchor="middle" className="gauge-num" fill={col}>{strat.na?'—':strat.score}</text>
      </svg>
      <div className="gauge-label">{strat.name}</div>
      <div className="gauge-note">{(strat.notes&&strat.notes[0])||''}</div>
    </div>
  );
}

function App(){
  const [inp, setInp] = useState({marketGreen:false});
  const [result, setResult] = useState(null);
  const [journal, setJournal] = useState(()=>{ try{return JSON.parse(localStorage.getItem('ssJournal'))||[];}catch(e){return [];} });
  useEffect(()=>{ try{localStorage.setItem('ssJournal',JSON.stringify(journal));}catch(e){} },[journal]);

  const set = (name,val)=> setInp(p=>({...p,[name]:val}));

  const run = ()=>{
    const d = {
      ticker:(inp.ticker||'').toUpperCase().replace(/[^A-Z0-9.]/g,'') || '—',
      price:num(inp.price), high52:num(inp.high52), low52:num(inp.low52),
      ma20:num(inp.ma20), ma50:num(inp.ma50), ma200:num(inp.ma200), rsi:num(inp.rsi),
      avgVol:num(inp.avgVol), todayVol:num(inp.todayVol), resistance:num(inp.resistance), support:num(inp.support),
      ret1m:num(inp.ret1m), ret3m:num(inp.ret3m), ret6m:num(inp.ret6m), ret12m:num(inp.ret12m),
      marketGreen:!!inp.marketGreen,
    };
    const acct = num(inp.accountSize);
    const a = analyze(d);
    const plan = a.verdict==='TRADE' ? riskPlan(d, a.tradeStrat, acct) : null;
    const res = {d, acct, a, plan};
    setResult(res);
    setJournal(j=>[{
      id: Date.now()+'-'+Math.round(Math.random()*1e4),
      ticker:d.ticker, verdict:a.verdict, strat:a.best.name, score:a.best.score,
      time:new Date().toLocaleString(), outcome:'open'
    }, ...j].slice(0,50));
  };

  const setOutcome = (id,o)=> setJournal(j=>j.map(e=> e.id===id ? {...e, outcome: e.outcome===o?'open':o} : e));
  const clearJournal = ()=>{ if(confirm('Clear the whole journal?')) setJournal([]); };

  const decided = journal.filter(e=>e.outcome==='win'||e.outcome==='loss');
  const wins = journal.filter(e=>e.outcome==='win').length;
  const hitRate = decided.length ? Math.round(wins/decided.length*100) : null;
  const tradeCount = journal.filter(e=>e.verdict==='TRADE').length;

  return (
    <div className="wrap">
      <div className="top"><a href="../index.html">← My Apps</a></div>
      <h1>Strategy Screener</h1>
      <div className="sub">Score any ticker against four evidence-backed strategies — and get a disciplined trade plan (or an honest NO TRADE).</div>

      <div className="panel">
        <h2>Inputs — enter what you know</h2>
        <div className="grid">
          {FIELDS.map(([name,label,cls])=>(
            <label key={name} className={'fld'+(cls?' '+cls:'')}>
              <span>{label}</span>
              <input inputMode={cls==='tick'?'text':'decimal'} value={inp[name]||''}
                onChange={e=>set(name,e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') run(); }} />
            </label>
          ))}
          <label className="fld"><span>Account size ($)</span>
            <input inputMode="decimal" value={inp.accountSize||''} onChange={e=>set('accountSize',e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') run(); }} placeholder="for position sizing" /></label>
          <label className="chk"><input type="checkbox" checked={!!inp.marketGreen}
            onChange={e=>set('marketGreen',e.target.checked)} /> Broader market / sector green today</label>
        </div>
        <div className="actions">
          <button className="btn-go" onClick={run}>▸ Screen ticker</button>
          <button className="btn-ghost" onClick={()=>{setInp({marketGreen:false});setResult(null);}}>Reset inputs</button>
        </div>
        <div className="hint">Tip: leave a field blank if you don't have it — the affected strategy just scores conservatively.</div>
      </div>

      {result && <Result res={result} />}

      <div className="panel">
        <h2>Session journal & hit rate</h2>
        <div className="hitrate">
          <div className="hr"><div className="n" style={{color: hitRate==null?'#7d8896':gaugeColor(hitRate)}}>{hitRate==null?'—':hitRate+'%'}</div><div className="l">hit rate ({wins}/{decided.length} decided)</div></div>
          <div className="hr"><div className="n">{journal.length}</div><div className="l">screens logged</div></div>
          <div className="hr"><div className="n">{tradeCount}</div><div className="l">TRADE verdicts</div></div>
        </div>
        {journal.length===0 ? <div className="empty">No screens yet. Run one above — every screen is logged so you can grade your own calls.</div> :
        <div className="scrollx"><table>
          <thead><tr><th>Time</th><th>Ticker</th><th>Verdict</th><th>Best fit</th><th>Score</th><th>Mark outcome</th></tr></thead>
          <tbody>{journal.map(e=>(
            <tr key={e.id}>
              <td style={{color:'#7d8896'}}>{e.time}</td>
              <td className="jt">${e.ticker}</td>
              <td className={e.verdict==='TRADE'?'v-go':'v-stop'}>{e.verdict}</td>
              <td>{e.strat}</td>
              <td style={{fontFamily:'var(--mono)'}}>{e.score}</td>
              <td>
                <button className={'obtn win'+(e.outcome==='win'?' on':'')} onClick={()=>setOutcome(e.id,'win')}>Win</button>
                <button className={'obtn loss'+(e.outcome==='loss'?' on':'')} onClick={()=>setOutcome(e.id,'loss')}>Loss</button>
              </td>
            </tr>
          ))}</tbody>
        </table></div>}
        {journal.length>0 && <div className="actions"><button className="btn-ghost" onClick={clearJournal}>Clear journal</button></div>}
      </div>

      <div className="footer">Strategy Screener · rules-based, hard-coded risk limits · not financial advice</div>
    </div>
  );
}

function Result({res}){
  const {d, acct, a, plan} = res;
  const go = a.verdict==='TRADE';
  return (
    <div className="panel">
      <h2>${d.ticker} — analysis</h2>
      <div className="gauges" style={{marginBottom:'18px'}}>
        {a.strategies.map(s=> <Gauge key={s.key} strat={s} active={go && a.tradeStrat && a.tradeStrat.key===s.key} />)}
      </div>

      <div className={'verdict '+(go?'go':'stop')}>
        <div className="v-big">{a.verdict}</div>
        {go && <div className="v-strat">Best fit: {a.best.name} · {a.best.score}/100</div>}
        <div className="v-reason">{a.reason}</div>
        <div className="bear"><b>Bear case:</b> {a.bear}</div>
      </div>

      {go && plan && (
        <div style={{marginTop:'18px'}}>
          <h2>Mandatory risk plan</h2>
          <div className="risk-grid">
            <div className="rk entry"><div className="v">{fmt(plan.entry)}</div><div className="l">Entry</div></div>
            <div className="rk stop2"><div className="v">{fmt(plan.stop)}</div><div className="l">Stop loss</div></div>
            <div className="rk target"><div className="v">{fmt(plan.target)}</div><div className="l">Target (2:1)</div></div>
            <div className="rk"><div className="v">{fmt(plan.riskPerShare)}</div><div className="l">Risk / share</div></div>
            <div className="rk"><div className="v">{plan.shares==null?'—':plan.shares.toLocaleString()}</div><div className="l">Position size (shares)</div></div>
            <div className="rk"><div className="v">{plan.positionValue==null?'—':fmt(plan.positionValue,{money:true})}</div><div className="l">Position value</div></div>
          </div>
          <div className="rk-note">
            {acct==null ? 'Enter your account size for exact position sizing.' :
              <span>Risking <b>{fmt(plan.riskDollars,{money:true})}</b> = <b>{plan.riskPct==null?'—':plan.riskPct.toFixed(2)+'%'}</b> of account · capped at the hard <b>2%</b> limit · reward:risk <b>2:1</b>.</span>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
